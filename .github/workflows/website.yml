name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/website.yml'
      - 'website/**'
      - 'docs/images/afterfeed-*.jpg'
      - 'public/brand/afterfeed-mark.svg'
      - 'public/favicon.svg'
  workflow_dispatch:

concurrency:
  group: website-production
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build
        run: sh website/build.sh

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy website/dist --project-name=afterfeed-site --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
