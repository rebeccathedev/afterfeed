[www]
listen = 0.0.0.0:9000
listen.allowed_clients = any
user = www-data
group = www-data
pm = dynamic
pm.max_children = 20
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 6
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
ping.path = /fpm-ping
ping.response = pong
access.log = /proc/self/fd/2
