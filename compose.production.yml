services:
  afterfeed:
    image: ${AFTERFEED_IMAGE:?Set AFTERFEED_IMAGE to the published GHCR image}
    restart: unless-stopped
    environment:
      APP_KEY: ${APP_KEY:?Set a persistent APP_KEY}
      APP_URL: ${APP_URL:-http://localhost:8080}
      AFTERFEED_MCP_ALLOWED_ORIGINS: ${AFTERFEED_MCP_ALLOWED_ORIGINS:-http://localhost:8080}
      DB_CONNECTION: ${DB_CONNECTION:-sqlite}
      DB_HOST: ${DB_HOST:-127.0.0.1}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-/var/www/html/database/database.sqlite}
      DB_USERNAME: ${DB_USERNAME:-afterfeed}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_SSLMODE: ${DB_SSLMODE:-prefer}
    volumes:
      - afterfeed-database:/var/www/html/database
      - afterfeed-storage:/var/www/html/storage/app
      - afterfeed-public:/var/www/html/public
    healthcheck:
      start_period: 45s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      afterfeed:
        condition: service_healthy
    ports:
      - "${AFTERFEED_PORT:-8080}:80"
    volumes:
      - afterfeed-public:/var/www/html/public:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  afterfeed-database:
  afterfeed-storage:
  afterfeed-public:
